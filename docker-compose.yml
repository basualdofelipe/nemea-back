services:
  postgres:
    image: postgres:16-alpine
    container_name: hefesto_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: hefesto_db
      POSTGRES_USER: hefesto
      POSTGRES_PASSWORD: hefesto_dev
    volumes:
      - hefesto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hefesto -d hefesto_db']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: hefesto_postgres_test
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: hefesto_test
      POSTGRES_USER: hefesto
      POSTGRES_PASSWORD: hefesto_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hefesto -d hefesto_test']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hefesto_pgdata:
